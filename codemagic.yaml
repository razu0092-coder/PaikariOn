workflows:
  android-workflow:
    name: Native Android Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Set execution permission for gradlew
        script: |
          chmod +x gradlew
      - name: Build Android APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
